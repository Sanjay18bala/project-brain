services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: project_brain
      POSTGRES_USER: project_brain
      POSTGRES_PASSWORD: project_brain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL (which points at localhost for host-side psql/tests) —
      # inside this container, the Postgres service is reachable at the hostname "postgres".
      DATABASE_URL: postgresql://project_brain:project_brain@postgres:5432/project_brain
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
